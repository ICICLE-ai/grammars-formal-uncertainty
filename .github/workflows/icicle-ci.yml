name: ICICLE CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Python package
        run: |
          python -m pip install build
          python -m build
      - name: Build the service and analyze the bundled SMT-LIB examples
        run: |
          docker build -t grammar-uncertainty-ci .
          docker run --rm -v "$PWD/samplesmtfolder:/samples:ro" grammar-uncertainty-ci grammar-uncertainty analyze /samples --grammar smtlib
