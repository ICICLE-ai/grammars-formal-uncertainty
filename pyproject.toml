[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grammar-uncertainty"
version = "0.1.0"
description = 'NeurIPS 2025, "Grammars of Formal Uncertainty". Analyze uncertainty in autoformalization by modeling formal grammars as probabilistic context-free grammars (PCFGs).'
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Debargha", email = "debargha@case.edu"}
]
keywords = ["pcfg", "grammar", "uncertainty", "entropy", "antlr", "parsing", "smt-lib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "antlr4-python3-runtime>=4.13.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "statsmodels>=0.13.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
grammar-uncertainty = "grammar_uncertainty.__main__:app"

[project.urls]
Homepage = "https://github.com/debarghag/grammars-formal-uncertainty"
Documentation = "https://github.com/debarghag/grammars-formal-uncertainty#readme"
Repository = "https://github.com/debargha/grammars-formal-uncertainty"

[tool.hatch.build.targets.wheel]
packages = ["src/grammar_uncertainty"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
